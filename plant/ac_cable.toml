# plant/ac_cable.toml - AC cables PV inverter -> EL
# Values, status and sources taken 1:1 from registry.py and SOURCES.md (2026-11-05).
# Only the owner changes values. Missing value = no 'value' field (MISSING).

[device]
name = "ac_cable"
title = "AC cables PV inverter -> EL"

[param."cable.ac_loss_rel"]
value = 0.005
unit = "-"
status = "PRELIM"
uncertainty = 0.5
source = "PRELIMINARY: typical AC-side loss 0.5-1% for short runs"
effect = "AC cable bar"

[param."cable.distance_inverter_EL_m"]
# value: MISSING
unit = "m"
status = "BACKLOG"
uncertainty = 0.0
source = "UNKNOWN - to be measured once layout exists"
effect = "drives cable losses"
