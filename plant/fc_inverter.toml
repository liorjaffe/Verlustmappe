# plant/fc_inverter.toml - FC inverter (Solis, off-grid)
# Current runtime record; supporting workbook reviewed 2026-11-18 (D3b, band 2026-11-19).
# Only owner-approved corrections applied. Missing value = no 'value' field (MISSING).

[device]
name = "fc_inverter"
title = "FC inverter (Solis, off-grid)"

[notes]
workbook = "plant/sources/Inverter2_FC_Solis_S5-EO1P5K-48_Specs_Master.xlsx"
owner_decision = "decisions/2026-11-18-fc-inverter-discharge-working-value.md"
transfer_scope = "Owner-approved rewrite 2026-11-19: inv_fc.eta per CONTRACT.md section 6 (D3b) as GUESS with two separate envelope-limit keys; uncertainties without a source set to 0.0 (NOT ASSESSED); existing keys kept."
registry_comments_status = "Historical. The 'DERIVED status' and 'matches exactly' statements below are superseded by D3b and by inv_fc.eta / inv_fc.nominal_power_W."
# Comments from registry.py, verbatim, historical:
registry_comments = '''
# FC-side inverter: CHOSEN DEVICE - Solis S5-EO1P5K-48 off-grid inverter
# (datasheet + instruction manual in the "Inverter 2" folder; nameplate photo
# with S/N 2051010224220020 confirms the physical unit is on site).
# Rated battery voltage 48 V (range 40-60 V) matches the FC bus; the tested
# Regatron README says the FCM-802 regulates the bus to 52 V - inside range.
# Rated 5 kVA/5 kW matches the 2x 2.5 kW FC bank exactly.
# EFFICIENCY - two sources disagree, registered separately (honest handling):
#   datasheet: peak efficiency (PV-AC path) 96.6%
#   instruction manual (series table): peak efficiency (PV-AC) 93-95%
# Both numbers refer to the PV->AC path (MPPT boost + inverter). The
# BATTERY->AC (discharge) path efficiency is NOT explicitly published.
# Working value: 0.94 (middle of the manual range), DERIVED status, to be
# replaced by measurement on the installed unit.'''

[param."inv_fc.model"]
value = "Solis S5-EO1P5K-48 off-grid, 230 V, pure sine, CAN/BMS comm"
unit = "-"
status = "DATASHEET"
uncertainty = 0.0
source = "Solis datasheet + nameplate photo (S/N 2051010224220020)"
effect = "the real FC-side inverter"

[param."inv_fc.nominal_power_W"]
value = 5000
unit = "W"
status = "DATASHEET"
uncertainty = 0.0
source = "Solis datasheet: rated output 5 kVA / 5 kW (+-1%)"
effect = "covers the FC bank (2x 2.5 kW nameplate, 2x 2.4 kW manual rated power); load-bin normalisation"

[param."inv_fc.battery_V_range"]
value = "40-60"
unit = "V"
status = "DATASHEET"
uncertainty = 0.0
source = "Solis datasheet + nameplate (battery voltage range)"
effect = "bus compatibility: FCM-regulated 52 V bus sits inside"

[param."inv_fc.eta_peak_pv_ac"]
value = 0.966
unit = "-"
status = "DATASHEET"
uncertainty = 0.0
source = "Solis datasheet: peak efficiency PV-AC path (MPPT + inverter); manual table states 93-95% (Inverter2 workbook, Master row 43: manufacturer documents disagree). Uncertainty 0.0 = NOT ASSESSED (no tolerance stated)."
effect = "PV-AC peak reference; NOT the battery-discharge path"

[param."inv_fc.eta_manual_range"]
value = "0.93-0.95"
unit = "-"
status = "DATASHEET"
uncertainty = 0.0
source = "Solis instruction manual series table: peak efficiency PV-AC 93-95% (differs from the datasheet 96.6% - discrepancy documented, both quoted)"
effect = "PV-AC reference only; NOT evidence for the battery-discharge path (CONTRACT.md section 6, D3b)"

[param."inv_fc.eta"]
value = 0.94
unit = "-"
status = "GUESS"
uncertainty = 0.0
source = "Owner working value (CONTRACT.md section 6, D3b; decisions/2026-11-18-fc-inverter-discharge-working-value.md): midpoint of the manual PV-AC range 93-95% (Inverter2 workbook, Master!D44). The discharge path is unpublished; PV-AC values are not evidence for it. Never MEASURED, DATASHEET or calibrated until measured (LCD counters, Inverter2 Master rows 79/85). Envelope in inv_fc.eta_envelope_lower/upper; no distribution adopted, uncertainty 0.0 = NOT ASSESSED."
effect = "FC DC->AC conversion bar (discharge side); energy-weighted mean excluding standby; part load not covered"

[param."inv_fc.eta_envelope_lower"]
value = 0.914
unit = "-"
status = "GUESS"
uncertainty = 0.0
source = "Owner convention 2026-11-19, provisional (decisions/2026-11-18-fc-inverter-discharge-working-value.md): no source; mirrored about the 0.94 working value (0.94 - 0.026). At part or low load the real value may be lower."
effect = "lower limit of the inv_fc.eta envelope; reference only, not propagated automatically"

[param."inv_fc.eta_envelope_upper"]
value = 0.966
unit = "-"
status = "GUESS"
uncertainty = 0.0
source = "Owner decision 2026-11-19, provisional (decisions/2026-11-18-fc-inverter-discharge-working-value.md): Solis datasheet PV-AC peak 96.6%, carried over to the discharge path by the owner assumption that the 40-60 V step-up path is not better (Inverter2 workbook, Master!D44). The number is a datasheet value; as a discharge-path limit it is an assumption."
effect = "upper limit of the inv_fc.eta envelope; reference only, not propagated automatically"

[param."inv_fc.standby_W"]
value = 20
unit = "W"
status = "GUESS"
uncertainty = 0.0
source = "ASSUMPTION: datasheet/manual do not publish idle consumption; the '20-50 W typical for 48 V off-grid class' range has no recorded source. Uncertainty 0.0 = NOT ASSESSED."
effect = "FC inverter standby bar"

[param."inv_fc.transfer_time_ms"]
value = 10
unit = "ms"
status = "DATASHEET"
uncertainty = 0.0
source = "Solis datasheet: transfer time 10 ms typical, 20 ms max"
effect = "UPS-like transfer behaviour, relevant to POC analysis context"
