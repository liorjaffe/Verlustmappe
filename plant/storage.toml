# plant/storage.toml - H2 storage (VITKOVICE)
# Current runtime record; supporting workbook reviewed 2026-11-13.
# Only owner-approved corrections applied. Missing value = no 'value' field (MISSING).

[device]
name = "storage"
title = "H2 storage (VITKOVICE)"

[open]
questions = [
  "BACKLOG: independent Route 2 PAUSED; DCT 541 is NOT installed and no tank temperature sensor exists or is planned (owner 2026-11-20). No independent countercheck quantity or uncertainty available.",
  "BACKLOG: thermally effective steel mass is unknown; bundle TARA includes the frame.",
]

[notes]
workbook = "plant/sources/Storage_H2_System_Specs_Master.xlsx"
owner_decision = "decisions/2026-11-13-storage-data.md"
pressure_instrumentation = "Future DCT 541 instrumentation, NOT installed per owner 2026-11-13. Datasheet parameters below describe the proposed sensor, not measured tank pressure or an existing acquisition path. Static pressure is an explicit scenario input."
route2_policy = "Independent Route 2 is unavailable until approved independent tank pressure/temperature data, connected volume/isolation, matching time boundaries and gas-flow accounting exist. No scenario substitute, independent vote or production-minus-delivered residual. Synthetic pVT tests retain only hypothetical instrument uncertainty, never measurement evidence."
working_pressure = "Owner 2026-11-13 withdraws stor.p_work_barg: Master row 6 / [S7] is an installer statement, not a valid working-pressure source for this plant. No replacement setpoint or fallback; tank pressure is an explicit input. PS is a permissible limit only."
transfer_scope = "Owner-approved working-pressure removal, TARA clarification, tank temperature sensor dropped from the project (owner 2026-11-20) and provisional temperature assumption. Workbook calculated/EOS values are not imported; other parameters and uncertainties remain unchanged."
temperature_policy = "Owner 2026-11-20: no tank temperature sensor will be installed; no measured tank temperature exists or is planned. Static main runs model a defined temperature, using stor.T_assumed_C when none is supplied. The +/-10 K band is a separate optional analysis, never an automatic main-run term or measurement-validity gate. Enapter telemetry belongs to its own measurement points, never the tank."

[param."stor.T_assumed_C"]
value = 20.0
unit = "degC"
status = "GUESS"
uncertainty = 0.019694704731012306
source = "Owner decision 2026-11-13 (decisions/2026-11-13-storage-data.md): 20 degC GUESS for provisional storage/booster calculations; rectangular band +/-10 K, standard u_T=10/sqrt(3) K. The uncertainty field is relative to ABSOLUTE temperature 293.15 K, not to 20 degC. Transferability: deliberate model convention for this plant, not measured/validated; no claimed seasonal coverage."
effect = "defined model temperature for static main runs, not a measured state. Rectangular-band uncertainty is used only with analyze_temperature_uncertainty=True: fixed-Z first-order u_T/T, separate from Route 2's existing 3 K allowance. Common-offset correlation is an optional-analysis model choice; mixed sources make only that analysis incomplete. Actual Z(T) local mass sensitivity at 300 bar absolute / 20 degC is -0.286176%/K; fixed-Z context -0.341122%/K. Sensitivities are references, not model inputs."

[param."stor.volume_L"]
value = 800
unit = "L"
status = "DATASHEET"
uncertainty = 0.005
source = "VITKOVICE cylinder nameplate (photo 20261001_083001): water volume 800 L. Status DATASHEET, not MEASURED: a nameplate is a manufacturer claim per this project's own status definitions. Hydrostatic or geometric confirmation still open"
effect = "Route 2 (tank pV) mass scales linearly with this"

[param."stor.type"]
value = "2 bundles x 16 x 50 L steel cylinders (Type I equivalent); sensors on bundle 1"
unit = "-"
status = "DATASHEET"
uncertainty = 0.0
source = "nameplate + visual inspection"
effect = "thermal behaviour: steel = high wall conductivity, less gas stratification than Type III/IV (de Miguel IJHE 2015)"

[param."stor.steel_mass_kg"]
value = 1430
unit = "kg"
status = "DATASHEET"
uncertainty = 0.2
source = "Storage_H2_System_Specs_Master.xlsx, Master C28/O28, Sources S1 (row 2): VITKOVICE nameplate photo 20261001_083001, 'TARA' 1430 kg incl. frame; NOT thermally effective steel mass. Transferability: same plant bundle; effective thermal mass OPEN."
effect = "bundle TARA only; GS fit runs gas-only without steel_mass_kg. Any use of 1430 kg as thermally effective mass requires an explicit upper-bound assumption, not a measured thermal mass."

[param."stor.p_max_barg"]
value = 300
unit = "barg"
status = "DATASHEET"
uncertainty = 0.0
source = "VITKOVICE nameplate: maximum allowable pressure PS 300 bar at 65 C; safety valve 330 bar"
effect = "permissible pressure limit only; tank pressure is an explicit input, never a working-pressure fallback"

[param."stor.T_max_C"]
value = 65
unit = "degC"
status = "DATASHEET"
uncertainty = 0.0
source = "VITKOVICE nameplate TS max +65 C (STRICTER than the 85 C SAE J2601 vehicle-tank limit)"
effect = "fast-fill safety limit for Route 2 temperature checks"

[param."stor.T_min_C"]
value = -20
unit = "degC"
status = "DATASHEET"
uncertainty = 0.0
source = "VITKOVICE nameplate TS min -20 C"
effect = "low-temperature limit"

[param."meas.p_sensor_model"]
value = "DCT 541, RS485 Modbus RTU, 316L, H2-rated (ISO 15001 oil/grease free)"
unit = "-"
status = "DATASHEET"
uncertainty = 0.0
source = "BD Sensors DCT 541 datasheet in the Storage H2 folder"
effect = "Route 2 pressure input"

[param."meas.p_sensor_fso_rel"]
value = 0.005
unit = "-"
status = "DATASHEET"
uncertainty = 0.0
source = "DCT 541 datasheet: accuracy per IEC 61298-2 (limit point adjustment: non-linearity, hysteresis, repeatability)"
effect = "Route 2 pressure uncertainty: 0.5% of FULL SCALE (FSO), not of reading"

[param."meas.p_sensor_range_bar"]
value = 400
unit = "bar gauge"
status = "DATASHEET"
uncertainty = 0.0
source = "DCT 541, 0...400 bar gauge, ordered per plan 2026-10-08"
effect = "Route 2 pressure input; confirm against the delivered sensor label"

[param."meas.p_sensor_fso_bar"]
value = 2.0
unit = "bar"
status = "DERIVED"
uncertainty = 0.0
source = "0.5% FSO x 400 bar (IEC 61298-2), derived from range and accuracy"
effect = "absolute pressure error per reading"

[param."meas.p_sensor_thermal_bar_per_10K"]
value = 0.8
unit = "bar/10K"
status = "DERIVED"
uncertainty = 0.0
source = "0.2% FSO / 10 K x 400 bar, derived"
effect = "pressure error during fast fills (not yet in the Route 2 budget)"

[param."meas.p_sensor_thermal_rel"]
value = 0.002
unit = "-"
status = "DATASHEET"
uncertainty = 0.0
source = "DCT 541 datasheet: thermal error +-0.2% FSO / 10 K in compensated range -20..80 C"
effect = "extra pressure error during fast fills (gas temperature swing)"

[param."meas.p_sensor_drift_rel"]
value = 0.001
unit = "-"
status = "DATASHEET"
uncertainty = 0.0
source = "DCT 541 datasheet: long-term stability <= +-0.1% FSO / year"
effect = "annual recalibration budget"

[param."meas.p_sensor_rate_Hz"]
value = 500
unit = "Hz"
status = "DATASHEET"
uncertainty = 0.0
source = "DCT 541 datasheet: measuring rate 500 Hz, delay 500 ms"
effect = "far above the 20 Hz fast-log requirement; latency budget"
