# plant/h2_compressor.toml - H2 booster HULC (two-stage, DLE15-H2 + DLE30-H2)
# Evidence: sources/Compressor_System_Specs_Master_v2.xlsx and cited sources.
# [layer1_evidence] is provisional documentation, not a runtime input.
# Only the owner changes values. Missing value = no 'value' field (MISSING).

[device]
name = "h2_compressor"
title = "H2 booster HULC (two-stage, DLE15-H2 + DLE30-H2)"

[open]
questions = [
  "Open manufacturer questions P-1 to P-3 (Maximator / H2 Core Systems): see [source_block].",
]

[layer1_evidence]
status = "PROVISIONAL; NON-EXECUTABLE; NOT A RUNTIME PARAMETER"
source = "Compressor_System_Specs_Master_v2.xlsx, Master rows 128-137 and 139; H2 Core Systems HydroHulc TDS_0012_9A-2, p. 2, air-consumption chart: https://www.h2coresystems.com/wp-content/uploads/HydroHulc_TDS_0012_9A-2.pdf"
text = '''
The workbook records approximate GRAPH-READ points from the H2 Core HydroHulc
chart, not from the separate Maximator base-device charts. At H2 flow in
NL/min, the workbook records air demand in NL/min as:
  Hulc 140: 10 -> 150, 20 -> 175, 30 -> 200, 40 -> 250, 50 -> 280,
            80 -> 380, 100 -> 475, 200 -> 900.
  Hulc 400: 10 -> 350, 20 -> 400, 30 -> 450, 40 -> 550, 50 -> 600,
            80 -> 800, 100 -> 975, 200 -> 1750.
The workbook estimates chart-reading uncertainty at about 25 NL/min per point.
Gas pressures, air-volume reference, module configuration and inclusion of
purge/control air are not established. The datasheet footnote gives an air
consumption example at 6 bar drive pressure and 20 strokes/min; its application
to the chart needs confirmation. Transfer to the installed -H2 variants and
adding both module curves for the two-stage system are UNVERIFIED (P-1).

At the illustrative 5 Nm3/h H2 maximum, not an adopted operating point, the
historical workbook estimated 390 + 825 = 1215 NL/min air demand and 14.6 Nm3
air per Nm3 H2. The origin of the addends is unclear; neither is measured demand.
Linear interpolation of the rounded workbook points at 83.33 NL/min H2 gives
approximately 396 + 829 = 1225 NL/min, not 1215; re-read the chart and check
the interpolation before using either estimate. These air-volume bases must be
checked before comparison with Kaeser normal-volume delivery.

The workbook's geometry-based Path B (rows 133-136) gives lower bounds of
4.59 at 6 bar drive and 125 barg interstage, and 6.30 at 9 bar drive and
140 barg interstage, in Nm3 air per Nm3 H2. It assumes base-device geometry and
excludes pilot/purge air. The 9 bar drive is an illustrative assumption, not
the owner's approximately 8.1 bar network-pressure statement documented in
kaeser.toml; neither establishes the actual drive pressure. These bounds are not alternative predictions of
actual air demand. The workbook flags Path A versus Path B in row 137
(`hulc.air_discrepancy`), about 14.6 versus 4.6-6.3, a factor of about 2-3.
Possible causes include chart conditions, pilot/control/purge air and gas
delivery efficiency; none is established as the cause.

Illustratively, nine EL at the registered nominal 500 NL/h each give 75 NL/min
H2 if all run at nominal output. Nine EL is an owner-decided modelling basis,
not site-verified; simultaneous nominal operation and delivery to HULC are not
established. Linear interpolation of the rounded Path A chart points gives
about 363 + 767 = 1130 NL/min air, subject to the same chart and addition
conditions. The Path B lower-bound ratios give about 344 and 473 NL/min for
their respective assumed pressures. These lower bounds being below the derived
Kaeser capacity in kaeser.toml [layer1_evidence] does not establish sufficient supply: real
demand can exceed a lower bound. Conversely Path A is not confirmed as the
installed system's demand. The 14.6 ratio is a historical estimate at the 5 Nm3/h example,
not a validated constant at 75 NL/min. On matching volume bases,
the derived Kaeser capacity divided by 75 is about 8.2 NL air per NL H2.

Conditional capacity finding at the illustrative HULC maximum of 5 Nm3/h,
not the nine-EL case: if the historical 1215 NL/min estimate and the
derived Kaeser capacity at its 10 bar datasheet point apply simultaneously
to the same stationary full-load case and compatible normal-volume bases,
supply/demand is approximately 0.51; HULC demand alone then exceeds supply,
before the Rotex or other consumers. Whether the actual
plant can run continuously at full load remains open. This ratio is not a duty
cycle. Kaeser's delivery and conversion are documented in kaeser.toml
[layer1_evidence].

Resolve by confirming P-1 with H2 Core/Maximator, including the installed -H2
modules and configuration; re-reading the curves at the relevant stage
conditions; and checking SIGMA CONTROL 2 load/operating hours over a known
period of HULC operation. Hours constrain aggregate compressor load, not HULC
allocation or a duty cycle by themselves. Workbook row 139 records a stage-2
counter increase of 434 from 2026-09-30 to 2026-10-27; whether counts mean
single or double strokes is open. Without that definition and timing, the
counter alone does not establish HULC runtime or duty cycle. No scenario,
capacity, electrical energy, runtime parameter or operational limit is
selected by this evidence.
'''

[source_block]
title = "HULC source conditions and open questions"
text = '''
Evidence: sources/Compressor_System_Specs_Master_v2.xlsx, Master and Sources
sheets; individual parameters identify the relevant rows and sources.
Workbook SHA-256: 07b082dbacf00dc6b9332d3d7ce0f262041003bdf3913cce0dacedad07a33145.
The prior workbook SHA-256 was c5585d5f4e6b73458c524106cdbc5b8002b67d57c1139220a9a704d30f1f1218.
The workbook is evidence, not the runtime parameter source. Manufacturer data
for DLE base devices are not verified for the installed -H2 variants. The
pressure reference is assumed gauge where marked; uncertainty 0.0 does not
establish zero uncertainty.

Agent checked 2026-11-16: workbook Master rows 86-91 and 97-102 against
the corresponding pressure ratios, inlet/outlet pressures, displacement,
cycle rate and compression ratios in the DLE 15 Apr-24 and DLE 30 Oct-25
base-type datasheets, page 1; row 108 against their drive-pressure ranges.
DLE 15: https://www.maximator.de/assets/mime/415f72351d5181b5354062839e0314ba/DB-01.02.02.02-Booster-DLE-15.pdf
DLE 30: https://maximatorus.com/uploads/Datasheets/DB-01.02.02.26-Booster-DLE-30-USA.pdf
The DLE 15 copy is not the workbook's S8 copy; the DLE 30 filename differs
from its internal identifier, as noted under hulc.pl_max_barg. Connections,
H2-option ratios and applicability to installed -H2 devices were not checked
by this comparison. H2 Core TDS p.2 module pressure classes, inlet limits and
maximum flow in rows 75, 77 and 78 were also checked; owner review is pending.

P-1: Confirm air-consumption chart conditions, volume basis, module
configuration, purge/control air and applicability to installed -H2 units.
P-2: Confirm whether the DLE table pressures are gauge or absolute.
P-3: Confirm applicable pressure limits for installed parts 3630.3019 and
3630.2374. Maximator Operating, maintenance and repair instructions for DLE 15
and DLE 30, section 4, p.5:
https://highpressuretech.com/wp-content/uploads/2022/06/DLE15-DLE30.pdf
lists maximum inlet and operating pressures of 150 and 300 bar respectively;
the base-type datasheets above list 300 and 600 bar respectively. Which
limits apply to the installed parts is UNVERIFIED.
'''

