# plant/system.toml - System-wide quantities without a device of their own
# Values, status and sources taken 1:1 from registry.py and SOURCES.md (2026-11-05).
# Only the owner changes values. Missing value = no 'value' field (MISSING).

[device]
name = "system"
title = "System-wide quantities without a device of their own"

[notes]
# Comments from registry.py, verbatim, unchecked:
registry_comments = '''
# ===================== MEASUREMENT CHAIN ====================='''

[param."meas.power_rel_unc"]
value = 0.02
unit = "-"
status = "GUESS"
uncertainty = 0.5
source = "ASSUMPTION: device-reported power (Enapter (EL) and legacy building-array telemetry), no independent power analyser yet"
effect = "floor of every efficiency's uncertainty"
