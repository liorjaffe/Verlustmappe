# plant/kaeser.toml - Compressor Kaeser SXC 8 (supplies the HULC and four Rotex)
# Evidence: sources/Compressor_System_Specs_Master_v2.xlsx and cited sources.
# [layer1_evidence] is provisional documentation, not a runtime input.
# Only the owner changes values. Missing value = no 'value' field (MISSING).

[device]
name = "kaeser"
title = "Compressor Kaeser SXC 8 (supplies the HULC and four Rotex)"

[layer1_evidence]
status = "PROVISIONAL; NON-EXECUTABLE; NOT A RUNTIME PARAMETER"
source = "Compressor_System_Specs_Master_v2.xlsx, Master rows 9-10, 28, 36-37 and 39; Kaeser SXC brochure P-651/26D .10/24, p. 6/7, workbook source S15"
text = '''
The delivery capacity and its reference conditions are recorded under
kaeser.q_fad_m3min; it is not HULC demand. Workbook Master row 9 states the
normal basis of 1.01325 bar absolute and 0 degC; row 10 records the rounded
factor 0.9196 with humidity neglected. The following dry ideal-gas formula
is reconstructed from these bases, not copied from an intact workbook formula:
  Q_normal = Q_FAD * (1 / 1.01325) * (273.15 / 293.15).
Workbook cell D37 contains a formula with the cached error #NAME?.
The factor is approximately 0.91959; the registered FAD gives about
616 NL/min. This is a calculated capacity at the datasheet point, not a measurement.
The conversion neglects humidity; applicability of the workbook's normal basis
to the HULC chart remains UNVERIFIED. Workbook Master row 39 and source S26
record the owner's 2026-10-27 statement of approximately 8.1 bar; it is not a
recorded pressure curve. Delivery at that pressure is not established.

The dealer's secondary power value and its pressure/flow conflict and unclear
dryer inclusion are recorded under kaeser.p_package_dealer_kw; input power at
the project operating point is not established. No interpolation between
pressure variants or specific electrical energy is adopted here. For the
conditional comparison with HULC demand, see h2_compressor.toml [layer1_evidence].
'''

