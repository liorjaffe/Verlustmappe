# plant/fc_battery.toml - H2Core battery on the FC DC bus
# Values, status and sources taken 1:1 from registry.py and SOURCES.md (2026-11-05).
# Only the owner changes values. Missing value = no 'value' field (MISSING).

[device]
name = "fc_battery"
title = "H2Core battery on the FC DC bus"

[open]
questions = [
  "D10: registry 100 Ah (BACKLOG) / 52 V versus datasheet GTEM-48V5000-E 105 Ah / 5 kWh / 48 V (52 V is the Regatron bus setpoint). Owner decides.",
]

[notes]
# Comments from registry.py, verbatim, unchecked:
registry_comments = '''
# ===================== BATTERY (no sensor) ====================='''

[param."bat.capacity_Ah"]
value = 100
unit = "Ah"
status = "BACKLOG"
uncertainty = 0.05
source = "PLACEHOLDER - enter the real battery capacity"
effect = "SoC bookkeeping route for the battery branch"

[param."bat.nominal_V"]
value = 52
unit = "V"
status = "DERIVED"
uncertainty = 0.02
source = "Regatron README (tested): FCM-802 regulates the bus to 52 V; 48 V is only the factory default. CONFLICTS with the earlier 48 V assumption - CONFIRM at the plant"
effect = "battery SoC energy conversion; P=V*I bookkeeping"
