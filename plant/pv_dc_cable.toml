# plant/pv_dc_cable.toml - DC cables PV array -> PV inverter
# Values, status and sources taken 1:1 from registry.py and SOURCES.md (2026-11-05).
# Only the owner changes values. Missing value = no 'value' field (MISSING).

[device]
name = "pv_dc_cable"
title = "DC cables PV array -> PV inverter"

[notes]
# Comments from registry.py, verbatim, unchecked:
registry_comments = '''
# --- cables and wiring (DC side PV->inverter, AC side inverter->EL bus) ---'''

[param."cable.dc_loss_rel"]
value = 0.01
unit = "-"
status = "PRELIM"
uncertainty = 0.5
source = "PRELIMINARY: typical DC-side wiring loss 1-2% for short, well-sized runs; DISTANCES UNKNOWN - placeholder until real lengths/gauges exist"
effect = "DC cable bar"

[param."cable.distance_pv_inverter_m"]
# value: MISSING
unit = "m"
status = "BACKLOG"
uncertainty = 0.0
source = "UNKNOWN - to be measured once layout exists"
effect = "drives cable losses"
