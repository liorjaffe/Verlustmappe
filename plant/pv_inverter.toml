identity = "S6-GR1P6K, F8 PV-side; distinct from the S5-EO1P5K-48 FC-side device. Workbook filename numbering is not a device identifier. Master rows 3-7; Notes row 3."
constant_use = "INTERIM owner model decision: use EU efficiency 0.971 as a constant pending eta(P), curve BACKLOG; see decisions/2026-11-13_pv-inverter-efficiency.md. The value is DATASHEET; constant-use modelling is DERIVED, not measured."
part_load_risk = "Without an F8 eta(P) curve, constant EU efficiency may overestimate low-load efficiency and underestimate conversion loss; direction/magnitude are not verified for F8. Legacy-array curves and sample extremes are not an F8 load distribution."
uncertainty = "No band adopted. Efficiency uncertainty is NOT ASSESSED; uncertainty = 0.0 does not mean exact or zero error. EU and maximum efficiencies are different metrics, not tolerance limits."
night_consumption = "Master row 35: manufacturer 'Self-consumption (night)' <1 W per unit, bound not exact. Actual power and energy remain missing, never zero. Workbook interpretation of the supply boundary is not independently verified; account B applies per CONTRACT.md."
startup = "Master row 12: 120 V start-up voltage is DATASHEET. Master rows 36, 50: startup energy OPEN; self-sufficient PV boot behaviour is an interpretation, not a manufacturer energy specification."
transferability = "Manufacturer S6-GR1P6K / 6K-column specifications apply per unit, not as combined two-unit ratings or measured F8 performance. Unit B nameplate is cited; unit A identity is platform-only. Original PDF/photo/API responses not independently reviewed."

