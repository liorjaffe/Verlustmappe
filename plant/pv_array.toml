# plant/pv_array.toml - PV array F8 (BYD455MGTK-36, east facade)
# Only the owner changes values. Missing value = no 'value' field (MISSING).

[device]
name = "pv_array"
title = "PV array F8 (BYD455MGTK-36, east facade)"

[notes]
generation_modelling = "Owner decision 2026-11-16: PV generation modelling is deferred for now; module modelling evidence is not an active priority. Existing values and assumptions are not thereby validated. See decisions/2026-11-16-pv-generation-modelling-deferred.md."
module_evidence = "Owner selected BYD455MGTK-36 and confirmed Imp = 10.90 A on 2026-11-16; see sources/PV_F8_System_Specs_Master.xlsx, Module rows 6 and 12. The official MGTK datasheet and legible frame-label photo remain open. Other parameter sources and statuses require separate review."
owner_decision_rated_power = "F8 rated DC power is 12.74 kWp (28 x 455 Wp), not the 12.78 kWp shown in the Solis station list; owner decision 2026-11-15, see decisions/2026-11-15-pv-module-count.md"

[param."pv.module_model"]
value = "BYD455MGTK-36"
unit = "-"
status = "OWNER_DECISION"
uncertainty = 0.0
source = "Owner decision 2026-11-16; PV_F8_System_Specs_Master.xlsx, Module row 6 and Sources [S1b]. Official MGTK datasheet and legible frame-label photo remain open."
effect = "identifies the F8 module; other parameter values require independent source review"

[param."pv.n_modules"]
value = 28
unit = "-"
status = "OWNER_DECISION"
uncertainty = 0.0
source = "Owner confirmation in chat 2026-11-15: F8 module count is 28; see decisions/2026-11-15-pv-module-count.md"
effect = "confirmed module count; array power = n_modules x 455 Wp"

[param."pv.string_config"]
value = "2 strings x 7 modules per inverter (assumed; verify at the DC junction boxes)"
unit = "-"
status = "GUESS"
uncertainty = 0.0
source = "ASSUMPTION from array design 2026-10-21"
effect = "string design checks only (Voc cold, Vmp window)"

[param."pv.module_efficiency_STC"]
value = 0.209
unit = "-"
status = "DATASHEET"
uncertainty = 0.01
source = "BYD MGK-36 datasheet Rev.06 (2024), 455 W class; Inmetro 006667/2021 class A 20.90 %. Superseded PRELIM: 0.220 (typical TOPCon)"
effect = "nominal DC power per m2 of array"

[param."pv.p_dc_stc_W"]
value = 12740
unit = "W"
status = "OWNER_DECISION"
uncertainty = 0.0
source = "Owner decision in chat 2026-11-15: F8 rated DC power is 12.74 kWp (28 x 455 Wp), rather than 12.78 kWp in the Solis station list; see decisions/2026-11-15-pv-module-count.md"
effect = "owner-selected F8 rated DC power; capture ratio in PVSystem.account (NOT valid for the removed legacy ~184 kWp building array)"

[param."pv.p_tc_pmax_per_K"]
value = -0.0038
unit = "1/K"
status = "DATASHEET"
uncertainty = 0.03
source = "BYD MGK-36 datasheet Rev.06: -0.380 %/degC (2021 brochure lists -0.352; Rev.06 is the newer official document). Superseded PRELIM: -0.0029"
effect = "cell-temperature derating"

[param."pv.noct_C"]
value = 45
unit = "degC"
status = "DATASHEET"
uncertainty = 0.05
source = "BYD MGK-36 datasheet Rev.06: 45 +-2 degC. Superseded PRELIM: 43"
effect = "cell temperature model: T_cell = T_amb + (NOCT-20)/800 * G"

[param."pv.bifacial_gain_frac"]
value = 0.0
unit = "-"
status = "GUESS"
uncertainty = 0.0
source = "Owner-confirmed interim assumption 2026-11-16: rear-side energy gain remains 0.0 pending a facade-specific decision. PV_F8_System_Specs_Master.xlsx, Module row 29: the cited 0.70 bifaciality factor is a module property, not the installation energy gain."
effect = "assumed DC energy gain from rear-side irradiance; actual facade gain remains unverified"

[param."pv.degradation_per_year"]
value = 0.0071
unit = "1/year"
status = "DATASHEET"
uncertainty = 0.1
source = "BYD MGK-36 datasheet Rev.06 linear power warranty -0.71 %/yr. Superseded PRELIM: 0.004"
effect = "multi-year studies only"

[param."pv.soi_uncertainty_rel"]
value = 0.03
unit = "-"
status = "PRELIM"
uncertainty = 0.5
source = "PRELIMINARY: irradiance-sensor uncertainty on capture-ratio (thermopile/pyranometer class)"
effect = "capture-ratio bar once a pyranometer exists"

[param."pv.soiling_rel"]
value = 0.02
unit = "-"
status = "PRELIM"
uncertainty = 0.5
source = "PRELIMINARY: typical soiling 1-4% (rainy coastal climate, no cleaning contract); Florianopolis is coastal+rains, low end plausible"
effect = "soiling bar"

[param."pv.mismatch_rel"]
value = 0.01
unit = "-"
status = "PRELIM"
uncertainty = 0.5
source = "PRELIMINARY: module mismatch 0.5-2%"
effect = "mismatch bar"

[param."pv.shading_rel"]
value = 0.02
unit = "-"
status = "PRELIM"
uncertainty = 0.8
source = "PRELIMINARY: shading/snow/edge 0-5%, site-specific, UNKNOWN until layout exists"
effect = "shading bar"
