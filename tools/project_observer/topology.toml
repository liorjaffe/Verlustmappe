to = "water"
medium = "aux"
label = "pump"
basis = "CONTRACT §4 B; owner 2026-11-19: supplied via the PMS from PV. Conflict: plant/water.toml open entry still says the pump is supplied from the house grid (not changed)"

[[edge]]
