# Plant topology for the observer's overview diagram (CONTRACT.md section 12).
# Display aid only: CONTRACT.md section 4 and plant/*.toml remain the source of truth.
# Every node and edge names its basis. Contains no parameter values.
# Agent transcription of CONTRACT section 4 and plant file titles. Owner review 2026-11-18:
# order, FC control, auxiliary-supplier marking, water path and Kaeser drive air confirmed;
# the four Rotex are shown but not assessed until the owner clarifies them.
# Owner 2026-11-19 (decisions/2026-11-19-island-supply-via-pms.md): the lab is treated as an
# island; all electricity at run time comes from the PV modules via the PMS, which feeds the
# electrolyser and every auxiliary consumer. Grid, PV-side batteries and their inverter are
# not modelled. Layout changed accordingly; owner review of the redrawn diagram pending.
reviewed = false
# Station descriptions below are agent drafts from the named basis; set true after owner review.
descriptions_reviewed = false

# Units shown per flow medium in the station cards (no values). Basis: quantity names in
# src/verlustmappe/accounting/ledger.py (energies in kWh, hydrogen as kg / mol / LHV kWh,
# compression air as energy in kWh) and plant/water.toml (water volume in L).
# Stations shared by A and B; their losses are split pro rata to energy (CONTRACT §4).
shared_supply = ["pv_inverter", "ac_cable", "pms"]

[units]
dc = "kWh"
ac = "kWh"
aux = "kWh"
h2 = "kg · mol · kWh (LHV)"
water = "L"
air = "kWh (compression air energy)"

[layout]
width = 1460
height = 785
node_w = 140
node_h = 58
# energy-flow view: taller boxes for the value slots
node_h_flow = 90
height_flow = 785

# ---------- Nodes (x, y = top-left corner) ----------
# kind: device | outside (outside the provisional boundary) | terminal
#       | supply (electricity source; its card also lists the auxiliary taps)
#       | unassessed (shown, but deliberately not assessed until the owner clarifies)
#       | prepared (in scope and drawn, not calculated yet)
# account: A (series path) | B (auxiliary) | S (safety system) | outside | not assessed  (CONTRACT section 4)
# description: what happens at the station; agent draft until descriptions_reviewed = true
# slots: value fields shown in the energy-flow view (no values; filled later from an approved
#        src pipeline result): in, out, eta, loss, stock, elec, air, ctrl, eout, total

[[node]]
id = "pv_array"
label = "PV array F8"
sub = "east facade"
plant = "pv_array"
kind = "outside"
x = 30
y = 50
account = "outside"
description = "Generates DC electricity on the east facade (F8). Outside the provisional boundary: PV generation modelling is deferred and the series path starts at the PV inverter DC input."
basis = "CONTRACT §2 (F8 only), §4 A (boundary starts at PV inverter DC input)"
slots = ["out"]

[[node]]
id = "pv_dc_cable"
label = "PV DC cable"
sub = "outside boundary"
plant = "pv_dc_cable"
kind = "outside"
x = 240
y = 50
account = "outside"
description = "Carries DC from the array to the PV inverters. Outside the provisional boundary until reviewed cable data exists; its loss is not assumed to be zero."
basis = "CONTRACT §4 A: upstream and outside the provisional boundary; loss not assumed zero"
slots = ["loss"]

[[node]]
id = "pv_inverter"
label = "PV inverters"
sub = "2 x Solis S6"
plant = "pv_inverter"
kind = "device"
x = 450
y = 50
account = "A"
description = "Converts PV DC into AC; first station of the series path. Its standby consumption is booked in B."
basis = "CONTRACT §4 A; plant/pv_inverter.toml title"
slots = ["in", "out", "eta", "loss"]

[[node]]
id = "ac_cable"
label = "AC cable"
sub = "inverters -> PMS"
plant = "ac_cable"
kind = "device"
x = 660
y = 50
account = "A"
description = "Carries AC from the PV inverters to the power management system (PMS). Cable specifications will follow; until then its loss is MISSING, not zero. Note: plant/ac_cable.toml still describes a cable PV inverter -> EL."
basis = "CONTRACT §4 A (AC distribution and cable path); owner 2026-11-19: EL supplied via the PMS (lab figure, Fotovoltaica/UFSC Fig. 3); plant/ac_cable.toml title still names the route PV inverter -> EL"
slots = ["in", "out", "loss"]

[[node]]
id = "el"
label = "Electrolyser"
sub = "Enapter AEM EL 2.1"
plant = "el"
kind = "device"
x = 1080
y = 50
account = "A"
description = "Splits process water into hydrogen and oxygen using electricity. During production the whole AC input is in A, its own auxiliaries embedded; start-up energy is a separate A line; standby is in B."
basis = "CONTRACT §4 A; §5 EL start-up (owner 2026-11-19); plant/el.toml title and el.startup_duration_s"
slots = ["in", "out", "eta", "loss", "start"]

[[node]]
id = "water"
label = "Water treatment"
sub = "filter train + RO (BWT)"
plant = "water"
kind = "device"
x = 1290
y = 50
account = "B"
description = "Treats collected rainwater into permeate for the electrolyser: Marte filter train, then BWT reverse osmosis; concentrate goes to the drain. Its electricity is auxiliary (B); the role of the Marte unit is open."
basis = "CONTRACT §4 (auxiliary energy includes water treatment); plant/water.toml title and notes; owner description 2026-11-18: rainwater from the PV roof -> collection tank -> Marte filter train (RESINA, CARVAO, 1 and 5 micron) -> BWT bestaqua 14ROC RO -> permeate to EL H2O IN, concentrate to drain. Open: whether the Marte unit only pre-treats for the BWT or operates independently (plant/water.toml [open])"
slots = ["elec", "out"]

[[node]]
id = "dryer"
label = "Dryer"
sub = "Enapter DRY 2.1"
plant = "dryer"
kind = "device"
x = 1080
y = 250
account = "A"
description = "Dries the hydrogen before compression. Its electricity is booked in B."
basis = "CONTRACT §4 A; plant/dryer.toml title"
slots = ["in", "out", "elec", "loss"]

[[node]]
id = "h2_compressor"
label = "H2 booster"
sub = "HULC, two-stage"
plant = "h2_compressor"
kind = "device"
x = 870
y = 250
account = "A"
description = "Raises the hydrogen pressure in two stages for storage, driven by compressed air from the Kaeser. Exclusively air-driven; no electrical connection (owner 2026-11-19)."
basis = "CONTRACT §4 A; plant/h2_compressor.toml title; owner 2026-11-19: exclusively compressed-air driven, therefore no auxiliary electricity tap"
slots = ["in", "out", "air", "loss"]

[[node]]
id = "kaeser"
label = "Air compressor"
sub = "Kaeser SXC 8"
plant = "kaeser"
kind = "device"
x = 1290
y = 250
account = "B"
description = "Supplies the compressed air that drives the H2 booster; it also supplies four Rotex (not assessed). Its electricity is in B; the air is allocated."
basis = "CONTRACT §4 B (Kaeser in B); plant/kaeser.toml title"
slots = ["elec", "out"]

[[node]]
id = "rotex"
label = "4 x Rotex"
sub = "not assessed"
plant = ""
kind = "unassessed"
x = 1290
y = 650
account = "S"
description = "Compressed-air consumers on the Kaeser that belong to the H2 safety system; relevant mainly at start-up according to the owner. Their air share is booked in S, not B. Not assessed until clarified."
basis = "plant/kaeser.toml title (Kaeser also supplies four Rotex); owner 2026-11-18: consumption relevant mainly at start-up, not assessed until clarified; owner 2026-11-19: part of the safety system (S)"
slots = []

[[node]]
id = "storage"
label = "H2 storage"
sub = "VITKOVICE"
plant = "storage"
kind = "device"
x = 660
y = 250
account = "A"
description = "Holds compressed hydrogen between production and the fuel cell. Its stock change stays visible separately."
basis = "CONTRACT §4 A; plant/storage.toml title"
slots = ["in", "out", "stock", "loss"]

[[node]]
id = "fc"
label = "Fuel cell"
sub = "2 x IE-LIFT 802"
plant = "fc"
kind = "device"
x = 450
y = 250
account = "A"
description = "Converts hydrogen into DC electricity on the FC DC bus."
basis = "CONTRACT §4 A; plant/fc.toml title"
slots = ["in", "out", "eta", "loss"]

[[node]]
id = "fc_battery"
label = "H2Core battery"
sub = "part of FC system"
plant = "fc_battery"
kind = "device"
x = 240
y = 450
account = "A"
description = "Battery on the FC DC bus, part of the FC system. Charge, discharge and stock change stay visible; battery discharge is not reconversion from hydrogen."
basis = "CONTRACT §4 A and last item (belongs to FC system); plant/fc_battery.toml title"
slots = ["in", "out", "stock", "loss"]

[[node]]
id = "dc_bus"
label = "FC DC bus"
sub = ""
plant = ""
kind = "device"
x = 450
y = 450
account = "A"
description = "Connects fuel cell, H2Core battery and the DC cable to the FC inverter. FC control is assumed to draw from here before the inverter (D22); measurement point open."
basis = "CONTRACT §4 A: DC bus and H2Core battery"
slots = ["in", "out", "ctrl", "loss"]

[[node]]
id = "fc_dc_cable"
label = "DC cable"
sub = "to FC inverter"
plant = ""
kind = "device"
x = 660
y = 450
account = "A"
description = "Carries DC from the FC DC bus to the FC inverter."
basis = "CONTRACT §4 A"
slots = ["in", "out", "loss"]

[[node]]
id = "fc_inverter"
label = "FC inverter"
sub = "Solis, off-grid"
plant = "fc_inverter"
kind = "device"
x = 870
y = 450
account = "A"
description = "Converts DC into the AC output. The conversion is in A; its own auxiliary consumption is in B."
basis = "CONTRACT §4 A; plant/fc_inverter.toml title"
slots = ["in", "out", "eta", "loss"]

[[node]]
id = "ac_out"
label = "AC output"
sub = "end of series path"
plant = ""
kind = "terminal"
x = 1080
y = 450
account = "A"
description = "End of the series path: AC output of the FC inverter."
basis = "CONTRACT §1, §4 A"
slots = ["eout"]

[[node]]
id = "pms"
label = "PMS"
sub = "distribution board"
plant = ""
kind = "supply"
x = 870
y = 50
account = "A and B (allocation)"
description = "Power management system: distributes PV electricity to the electrolyser (series path, A) and to every auxiliary consumer (B), down to the standby of the FC inverter. Island assumption: at run time all electricity comes from the PV modules; grid, PV-side batteries and their inverter are not modelled. Physically a passive distribution board without readings (owner 2026-11-19). Losses only from component data (e.g. breaker power loss per pole, scaled with the operating current), never as a difference; until then MISSING. Own consumption only if the board holds active elements (contactor coils, meters, monitoring); that would be auxiliary energy (B). Its loss is split between A and B pro rata to energy (CONTRACT §4)."
basis = "Owner 2026-11-19 (decisions/2026-11-19-island-supply-via-pms.md); lab figure Fotovoltaica/UFSC Fig. 3 (PV inverter, grid and battery inverter feed the PMS, PMS feeds the AEM electrolyser bank); CONTRACT §4 supply (2026-11-19)"
slots = ["in", "out", "loss"]

[[node]]
id = "ventilation"
label = "Room ventilation"
sub = "CELAB"
plant = "ventilation"
kind = "prepared"
x = 870
y = 650
account = "S"
description = "Ventilates the H2 room as part of the safety system. A direct measurement by the owner is planned; its consumption will then be used as a constant input. Prepared, not calculated."
basis = "Owner 2026-11-19 (decisions/2026-11-19-safety-system-group-s.md); CONTRACT §2 and §4 (S)"
slots = []

[[node]]
id = "h2_sensors"
label = "H2 sensors"
sub = "gas detection"
plant = "h2_sensors"
kind = "prepared"
x = 1080
y = 650
account = "S"
description = "Detect hydrogen in the room as part of the safety system. Details to follow from the owner. Prepared, not calculated."
basis = "Owner 2026-11-19 (decisions/2026-11-19-safety-system-group-s.md); CONTRACT §2 and §4 (S)"
slots = []

[[group]]
label = "S – safety system (prepared, not calculated)"
x = 850
y = 615
w = 600
h = 150

# ---------- Auxiliary electricity bus (drawn as one line) ----------

[[bus]]
medium = "aux"
points = [[555, 170], [1450, 170], [1450, 390], [980, 390]]

[[bus]]
medium = "aux"
points = [[940, 108], [940, 170]]

[[bus]]
medium = "aux"
points = [[1450, 390], [1450, 600], [940, 600]]

# ---------- Edges ----------
# medium: dc | ac | h2 | water | air | aux
# Either `from` (node id) or `from_point` (a point on a bus) is required; with both, `from`
# names the source and `from_point` only sets where the line starts.
# `value_at_station = true` omits the flow's value slot because the amount has a slot at a station.
# `via` adds orthogonal routing points. `both = true` draws arrows at both ends.
# `label_side = "left"` puts the label of a vertical line on its left.
# `assess = false` draws a flow faded and without a value slot (deliberately not assessed).

[[edge]]
from = "pv_array"
to = "pv_dc_cable"
medium = "dc"
basis = "CONTRACT §4 A"

[[edge]]
from = "pv_dc_cable"
to = "pv_inverter"
medium = "dc"
basis = "CONTRACT §4 A"

[[edge]]
from = "pv_inverter"
to = "ac_cable"
medium = "ac"
basis = "CONTRACT §4 A"

[[edge]]
from = "ac_cable"
to = "pms"
medium = "ac"
basis = "Owner 2026-11-19: PV inverters feed the PMS"

[[edge]]
from = "pms"
to = "el"
medium = "ac"
label = "PV (island)"
basis = "Owner 2026-11-19: the PMS feeds the EL; at run time all electricity is assumed to come from PV (island). The PV slice for the series path remains an allocation (CONTRACT §4 A). Cable PMS -> EL: specifications to follow"

[[edge]]
from = "water"
to = "el"
medium = "water"
label = "permeate"
basis = "Owner description 2026-11-18: RO permeate to EL H2O IN; plant/water.toml notes (water quality). Marte role open"

[[edge]]
from = "el"
to = "dryer"
medium = "h2"
basis = "CONTRACT §4 A"

[[edge]]
from = "dryer"
to = "h2_compressor"
medium = "h2"
basis = "CONTRACT §4 A"

[[edge]]
from = "kaeser"
to = "h2_compressor"
medium = "air"
label = "drive air (allocated)"
via = [[1330, 365], [940, 365]]
basis = "plant/kaeser.toml title (supplies the HULC and four Rotex); CONTRACT §4 allocated compressed-air supply"

[[edge]]
from = "kaeser"
to = "rotex"
medium = "air"
assess = false
basis = "plant/kaeser.toml title; owner 2026-11-18: not assessed until clarified; owner 2026-11-19: Rotex air share belongs to S"

[[edge]]
from = "h2_compressor"
to = "storage"
medium = "h2"
basis = "CONTRACT §4 A"

[[edge]]
from = "storage"
to = "fc"
medium = "h2"
basis = "CONTRACT §4 A"

[[edge]]
from = "fc"
to = "dc_bus"
medium = "dc"
basis = "CONTRACT §4 A"

[[edge]]
from = "fc_battery"
to = "dc_bus"
medium = "dc"
both = true
basis = "CONTRACT §4 A: battery throughput and stock change separately visible; not reconversion from H2"

[[edge]]
from = "dc_bus"
to = "fc_dc_cable"
medium = "dc"
basis = "CONTRACT §4 A"

[[edge]]
from = "fc_dc_cable"
to = "fc_inverter"
medium = "dc"
basis = "CONTRACT §4 A"

[[edge]]
from = "fc_inverter"
to = "ac_out"
medium = "ac"
basis = "CONTRACT §4 A"

[[edge]]
from = "dc_bus"
from_point = [480, 450]
to = "fc"
medium = "dc"
value_at_station = true
label = "FC control"
label_side = "left"
basis = "CONTRACT §4 (D22): FC control is netted in the series path (account A), booked once; drawing it from the DC bus before the inverter is an assumption; measurement point open"

[[edge]]
